# 同一台云主机：公网只开 80/443（和 SSH）。
# API 映射本机 8000，Grafana 映射 127.0.0.1:3000。
# 把 example.com 换成你的域名，并配好证书。
#
# 推荐：API 与 Grafana 共用一个 server_name，Grafana 走 /grafana/ 。
# 此时 .env 需要：
#   GRAFANA_ROOT_URL=https://api.example.com/grafana/
#   GF_SERVER_SERVE_FROM_SUB_PATH=true
# proxy_pass 不要写成 http://127.0.0.1:3000/（多一个斜杠会剥掉 /grafana）。

upstream timeflow_api {
    server 127.0.0.1:8000;
}

upstream timeflow_grafana {
    server 127.0.0.1:3000;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://timeflow_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/api/live/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://timeflow_grafana;
    }

    location /metrics {
        return 404;
    }

    location / {
        proxy_pass http://timeflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 可选：Grafana 使用独立子域名时，用下面这个 server，并删掉上面的 /grafana/ 三段。
