global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          app: prometheus

  - job_name: timeflow
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          app: timeflow
