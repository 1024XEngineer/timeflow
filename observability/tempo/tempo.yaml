server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /Users/mac/Desktop/tf/observability/data/tempo/wal
    local:
      path: /Users/mac/Desktop/tf/observability/data/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: []
