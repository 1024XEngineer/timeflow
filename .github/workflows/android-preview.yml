# Android PR preview. On-demand only — not on pull_request.
# Trigger with a PR comment `/android-preview`, or Actions → Run workflow.
# Regular PR pushes keep using ci.yml and do not build an APK.
#
# issue_comment always runs this file from the default branch. The build job
# then checks out the PR head SHA. That job runs PR-controlled code and must
# never reference APPETIZE_API_TOKEN. Upload/comment is a separate job that
# only downloads the APK artifact — no checkout, npm, Expo, or Gradle.
name: Android Preview

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to build an Appetize Android preview for
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.20.2"
  JAVA_VERSION: "17"

jobs:
  resolve:
    name: Resolve preview target
    if: >
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login != 'github-actions[bot]'
        && contains(github.event.comment.body, '/android-preview')
        && (
          github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.target.outputs.ok }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      head_ref: ${{ steps.target.outputs.head_ref }}
      head_repo_url: ${{ steps.target.outputs.head_repo_url }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve PR head
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const isCommandLine = (line) => {
              const trimmed = line.trim();
              return trimmed === '/android-preview' || trimmed.startsWith('/android-preview ');
            };

            if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment;
              if (!comment || comment.user?.type === 'Bot') {
                core.setOutput('ok', 'false');
                return;
              }
              const body = comment.body || '';
              if (!body.split(/\r?\n/).some(isCommandLine)) {
                core.info('Comment mentions the command but is not a /android-preview line.');
                core.setOutput('ok', 'false');
                return;
              }
              const allowed = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
              if (!allowed.has(comment.author_association)) {
                core.info(
                  `Ignoring /android-preview from ${comment.user.login} (${comment.author_association})`,
                );
                core.setOutput('ok', 'false');
                return;
              }
            }

            const raw =
              context.eventName === 'workflow_dispatch'
                ? context.payload.inputs.pr_number
                : String(context.issue.number);
            const prNumber = Number(raw);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${raw}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is ${pr.state}`);
              return;
            }

            const headRepo = pr.head.repo && pr.head.repo.full_name;
            if (headRepo !== `${owner}/${repo}`) {
              core.info(`Skipping fork PR #${prNumber} from ${headRepo}`);
              core.setOutput('ok', 'false');
              return;
            }

            core.setOutput('ok', 'true');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo_url', pr.head.repo.html_url);
            core.info(`Preview target: PR #${pr.number} ${pr.head.sha} (${pr.head.ref})`);

  build:
    name: Build preview APK
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      # android/ is gitignored; generate it from app.config.js on the runner.
      - name: Generate Android project
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: npx expo prebuild --platform android --clean --non-interactive --no-install

      # Debug APKs set BuildConfig.DEBUG and still contact Metro at runtime,
      # which Appetize cannot reach. Release embeds JS and loads it offline.
      # Expo's prebuild template signs release with the debug keystore.
      - name: Bake Appetize backend URLs
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_API_URL}" ]; then
            echo "EXPO_PUBLIC_API_URL is unset; APK will keep localhost defaults."
            exit 0
          fi
          python3 <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse, urlunparse

          api = os.environ["EXPO_PUBLIC_API_URL"].strip()
          parsed = urlparse(api)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit(
                  "EXPO_PUBLIC_API_URL must be https://... ; "
                  "assembleRelease blocks cleartext HTTP/WS on Android 9+"
              )
          path = parsed.path.rstrip("/")
          ws_path = path[: -len("/api/v1")] + "/ws" if path.endswith("/api/v1") else "/ws"
          ws = urlunparse(("wss", parsed.netloc, ws_path, "", "", ""))
          Path(".env").write_text(
              "\n".join(
                  [
                      f"EXPO_PUBLIC_API_URL={api}",
                      f"EXPO_PUBLIC_WS_URL={ws}",
                      "EXPO_PUBLIC_DEVICE_ID=appetize-preview",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          print(f"Preview API: {api}")
          print(f"Preview WS: {ws}")
          PY

      - name: Assemble release APK
        env:
          # Cover Appetize ARM devices and x86_64 emulator images.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,x86_64
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            set -a
            # shellcheck disable=SC1091
            . .env
            set +a
          fi
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
          (cd android && ./gradlew :app:assembleRelease --build-cache --stacktrace)

      - name: Locate preview APK
        id: apk
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/frontend/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Expected APK missing: $apk" >&2
            find "$GITHUB_WORKSPACE/frontend/android/app/build/outputs" -type f -name '*.apk' >&2 || true
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # Token is never in env while npm / Expo / Gradle run. This job only
  # downloads the APK artifact from the current run.
  publish:
    name: Publish Appetize preview
    needs: [resolve, build]
    if: needs.build.result == 'success' && needs.resolve.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-preview-apk
          path: apk

      - name: Locate preview APK
        id: apk
        run: |
          set -euo pipefail
          apk="$(find apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "Expected APK missing from artifact" >&2
            find apk -type f >&2 || true
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"

      - name: Upload APK to Appetize
        id: appetize
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${APPETIZE_API_TOKEN}" ]; then
            echo "Repository secret APPETIZE_API_TOKEN is not set." >&2
            exit 1
          fi
          response="$(mktemp)"
          http_code="$(
            curl -sS --http1.1 --max-time 300 \
              -o "$response" -w "%{http_code}" \
              -X POST "https://api.appetize.io/v2/builds" \
              -H "X-API-KEY: ${APPETIZE_API_TOKEN}" \
              -F "file=@${APK_PATH}" \
              -F "platform=android"
          )"
          if [ "$http_code" != "200" ]; then
            echo "Appetize upload failed: HTTP ${http_code}" >&2
            cat "$response" >&2
            exit 1
          fi
          build_id="$(jq -r '.id // .buildId // empty' "$response")"
          if [ -z "$build_id" ] || [ "$build_id" = "null" ]; then
            echo "Appetize response did not include a build id" >&2
            cat "$response" >&2
            exit 1
          fi
          preview_url="https://appetize.io/app/${build_id}"
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"
          echo "Preview: ${preview_url}"

      - name: Comment or update Appetize preview link
        if: steps.appetize.outcome == 'success'
        uses: actions/github-script@v7
        env:
          COMMENT_MARKER: "<!-- timeflow-android-appetize-preview -->"
          PREVIEW_URL: ${{ steps.appetize.outputs.preview_url }}
          BUILD_ID: ${{ steps.appetize.outputs.build_id }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HEAD_REPO_URL: ${{ needs.resolve.outputs.head_repo_url }}
        with:
          script: |
            const marker = process.env.COMMENT_MARKER;
            const previewUrl = process.env.PREVIEW_URL;
            const buildId = process.env.BUILD_ID;
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = process.env.HEAD_SHA;
            const headRepo = process.env.HEAD_REPO_URL;
            if (!previewUrl || !buildId || !prNumber || !sha || !headRepo) {
              core.setFailed('Appetize preview URL was not produced');
              return;
            }

            const shortSha = sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Android 预览（Appetize）',
              '',
              '在浏览器中打开并操作本次提交构建的 Android APK（无需安装）：',
              '',
              `**[打开预览](${previewUrl})**`,
              '',
              `- 提交：[\`${shortSha}\`](${headRepo}/commit/${sha})`,
              `- Build ID：\`${buildId}\``,
              `- 工作流：[本次运行](${runUrl})`,
              '',
              '再次发送同一命令，或在 Actions 里手动 Run workflow，会更新本条链接。日常推送不会自动打包。',
              '',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.body &&
                comment.body.includes(marker) &&
                comment.user &&
                comment.user.login === 'github-actions[bot]',
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
